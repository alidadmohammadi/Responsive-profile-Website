<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>my profile</title>
    <link rel="icon" type="image/x-icon" href="images/icon-profile.jpg" />
    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    
    <header>
      <h1>My profile</h1>
    </header>

    <main>
      <section class="profile">
        <div class="image_frame">
          <img src="images/photo_ (1).jpg" alt="my personal photo" />
        </div>
        <h2>Hello, I'm Alidad!</h2>
        <p id="description">
          An Informatics Engineering student interested in technology and web
          development
        </p>
      </section>

      <section>
        <h3>My Hobbies:</h3>
        <div class="hobbies">
          <article class="hobbies-card">
            <div class="image-area">
              <img
                src="images/code_icon-removebg-preview.png"
                alt="coding icon"
              />
            </div>
            <div class="text-area">Coding</div>
          </article>
          <article class="hobbies-card">
            <div class="image-area">
              <img
                src="images/reading-icon-png_265270-removebg-preview.png"
                alt="Reading icon"
              />
            </div>
            <div class="text-area">Reading</div>
          </article>
          <article class="hobbies-card">
            <div class="image-area">
              <img
                src="images/watching_movie_icon-removebg-preview.png"
                alt="watching movies icon"
              />
            </div>
            <div class="text-area">Watching movies</div>
          </article>
        </div>
      </section>
    </main>
    <footer>
      <button id="change-text" type="button">Change Text</button>

      <button id="change-theme" type="button">Change Theme</button>
    </footer>
    <script src="script.js"></script>
  </body>
</html>
